<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>FRMOIN Rewards</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">F</span><div><b>FRMOIN</b><small>REWARDS</small></div></div>
      <div class="status-dot">●</div>
    </header>

    <section class="hero glass">
      <div class="avatar" id="avatar">F</div>
      <div class="welcome">Welcome, <strong id="username">Guest</strong><span>Ready to earn?</span></div>
    </section>

    <section class="balance-card glass">
      <span class="label">YOUR BALANCE</span>
      <div class="balance"><span id="balance">0</span><small> COINS</small></div>
      <div class="balance-sub">100 coins = 1 reward unit</div>
    </section>

    <section class="reward-card glass">
      <div class="reward-icon">🎁</div>
      <div class="reward-copy"><h2>Watch Ad & Earn</h2><p>Complete a rewarded ad to receive coins.</p></div>
      <button id="watchAd" class="premium-btn">WATCH AD <span>→</span></button>
      <p id="adStatus" class="status">Ad system is ready to connect.</p>
    </section>

    <section class="quick-grid">
      <div class="mini-card glass"><b id="today">0</b><span>Today</span></div>
      <div class="mini-card glass"><b id="total">0</b><span>Total Earned</span></div>
      <div class="mini-card glass"><b>24/7</b><span>Availability</span></div>
    </section>

    <footer>Telegram Mini App • FRMOIN</footer>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
